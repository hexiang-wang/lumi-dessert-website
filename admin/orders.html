<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Orders — Lumi Internal</title>
<link rel="icon" href="../images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/order.css">
<style>
  body { background: var(--cream); }
  .admin-wrap { max-width: 920px; margin: 0 auto; padding: 50px 24px 100px; }
  .admin-title { font-family: var(--font-display); font-size: 1.8rem; color: var(--coffee-deep); margin: 0 0 6px; }
  .admin-sub { color: var(--text-soft); margin: 0 0 28px; font-size: 0.95rem; }
  .lock-screen .field { max-width: 320px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .filter-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-soft); }
  .order-card { background: var(--white); border: 1px solid rgba(107,70,48,0.1); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .order-card.is-fulfilled { opacity: 0.55; }
  .order-main h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--coffee-deep); font-family: var(--font-display); }
  .order-main p { margin: 2px 0; font-size: 0.88rem; color: var(--text-soft); }
  .order-main .amount { color: var(--pink); font-weight: 700; }
  .order-note { font-size: 0.85rem; color: var(--text); margin-top: 6px; font-style: italic; }
  .fulfill-btn { white-space: nowrap; border: none; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
  .fulfill-btn.mark-done { background: var(--pink); color: var(--white); }
  .fulfill-btn.mark-undo { background: var(--cream); color: var(--text-soft); border: 1.5px solid rgba(107,70,48,0.15); }
  .empty-state { color: var(--text-soft); text-align: center; padding: 60px 0; }
  .admin-nav { margin-bottom: 20px; font-size: 0.88rem; }
  .admin-nav a { color: var(--pink); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="admin-wrap">
  <a href="../index.html" style="font-family:var(--font-script);font-size:1.6rem;color:var(--pink);text-decoration:none;">lumi</a>

  <div id="lock-screen" class="lock-screen">
    <h1 class="admin-title" style="margin-top:24px;">Enter Passphrase</h1>
    <p class="admin-sub">Internal tool — not for customers.</p>
    <label class="field">
      <span>Passphrase</span>
      <input type="password" id="passphrase-input">
    </label>
    <button class="btn btn-primary" id="unlock-btn">Unlock</button>
    <p class="form-error" id="lock-error" hidden></p>
  </div>

  <div id="orders-tool" hidden>
    <p class="admin-nav"><a href="invoice.html">→ Create a custom invoice</a></p>
    <h1 class="admin-title">Orders</h1>
    <p class="admin-sub">Last 50 successful payments. Marking an order fulfilled updates both the PaymentIntent and Charge, so Dashboard metadata search stays consistent.</p>

    <div class="toolbar">
      <label class="filter-toggle">
        <input type="checkbox" id="hide-fulfilled" checked>
        Hide fulfilled orders
      </label>
      <button class="btn btn-ghost" id="refresh-btn" style="color:var(--pink);border-color:var(--pink);">Refresh</button>
    </div>

    <div id="orders-list"></div>
  </div>
</div>

<script src="../js/admin-orders.js"></script>
</body>
</html>
